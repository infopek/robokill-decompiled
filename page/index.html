<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Robokill</title>

  <style>
    /* --- page layout --- */
    html, body {
      height: 100%;
      margin: 0;
      background: #111;
      display: flex;
      align-items: center;        /* vertical centre */
      justify-content: center;    /* horizontal centre */
      font: 14px/1.4 system-ui, sans-serif;
      color: #ddd;
    }

    /* --- frame styling --- */
    #game-wrapper {
      box-shadow: 0 0 20px rgba(0, 0, 0, .8);
      border-radius: 4px;
      overflow: hidden;           /* round corners on WebGL canvas */
    }

    /* --- fallback message (JS disabled) --- */
    noscript {
      max-width: 240px;
      text-align: center;
      line-height: 1.6;
    }
  </style>

  <!-- Ruffle configuration must come *before* the script import. -->
  <script>
    window.RufflePlayer = {
      // Applies to every Ruffle player on the page
      config: {
        graphics: "webgl",                 // force GPU renderer
        audio:   { buffer: 512 },          // low-latency ~12 ms
        quality: "high",                   // keep filters on
      }
    };
  </script>
  <!-- Self-hosted (nightly) build of Ruffle -->
  <script src="ruffle/ruffle.js"></script>
</head>

<body>
  <div id="game-wrapper">
    <object  id="robokill"
             type="application/x-shockwave-flash"
             data="../build/robokill.swf"
             width="800"
             height="600">
      <param name="movie"   value="build/robokill.swf">
      <param name="quality" value="high">
      <param name="allowScriptAccess" value="always">
      <!-- fallback when Ruffle fails -->
      <div>
        <p><strong>Robokill</strong> requires a Flash player.</p>
        <p>Your browser should load an embedded emulator automatically, but it appears something went wrong.</p>
      </div>
    </object>
  </div>

  <noscript>
    <p><strong>Robokill</strong> is a Flash game.</p>
    <p>Please enable JavaScript to run the built-in Flash emulator (Ruffle).</p>
  </noscript>
</body>
</html>
